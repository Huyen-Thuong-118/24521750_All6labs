# nginx_tls.conf — Modern TLS configuration for Lab 4 PKI demo
# Requires: nginx >= 1.21, OpenSSL >= 1.1.1 (for TLS 1.3 support)
# Usage: include this file from your server {} block

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name lab4.local;

    # ── Certificate chain ────────────────────────────────────────────────────
    ssl_certificate      /etc/ssl/lab4/server_chain.pem;
    ssl_certificate_key  /etc/ssl/lab4/server.key;

    # ── Protocol: TLS 1.3 only (TLS 1.2 as fallback for legacy clients) ─────
    ssl_protocols TLSv1.2 TLSv1.3;

    # ── TLS 1.3 cipher suites (ordered by security; AES-256-GCM preferred) ──
    # TLS 1.3 cipher suites are non-negotiable and always secure; listing here
    # is informational only (nginx ignores ssl_ciphers for TLS 1.3)
    #   TLS_AES_256_GCM_SHA384
    #   TLS_CHACHA20_POLY1305_SHA256
    #   TLS_AES_128_GCM_SHA256

    # ── TLS 1.2 cipher suites: ECDHE + AEAD only (no RSA key exchange) ──────
    ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256";

    # Prefer server cipher order (matters for TLS 1.2; TLS 1.3 ignores it)
    ssl_prefer_server_ciphers on;

    # ── ECDH curve for key exchange ──────────────────────────────────────────
    ssl_ecdh_curve X25519:prime256v1:secp384r1;

    # ── Session resumption (TLS 1.3 uses PSK tickets automatically) ──────────
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;  # disable tickets for TLS 1.2 (prefer cache)

    # ── OCSP stapling ────────────────────────────────────────────────────────
    ssl_stapling        on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/ssl/lab4/ca_chain.pem;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'" always;

    root  /var/www/lab4;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

# ── Redirect HTTP to HTTPS ───────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name lab4.local;
    return 301 https://$host$request_uri;
}
